<rect x="99" y="342" width="7" height="196" rx="3" fill="url(#a)"/>
<text x="127" y="380" font-family="Arial,sans-serif" fill="#bca4ff" font-size="18" font-weight="bold">ARMIQO BRAIN · ACTION PLAN</text>
<text x="127" y="424" font-family="Arial,sans-serif" fill="#f9f8ff" font-size="24" font-weight="bold">01  Check the actual signal</text>
<text x="170" y="450" font-family="Arial,sans-serif" fill="#c5c0d3" font-size="18">Is the sponsor gone, busy, or evaluating alternatives?</text>
<text x="127" y="485" font-family="Arial,sans-serif" fill="#f9f8ff" font-size="24" font-weight="bold">02  Send a useful, low-friction check-in</text>
<text x="170" y="511" font-family="Arial,sans-serif" fill="#c5c0d3" font-size="18">Share an outcome recap and ask one specific question.</text>
