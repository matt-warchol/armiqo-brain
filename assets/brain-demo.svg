<text x="176" y="80" font-family="Arial, sans-serif" fill="#d8d5e4" font-size="21" font-weight="bold">Armiqo Brain</text><text x="1011" y="80" font-family="Arial, sans-serif" font-size="15" fill="#b8aacd">MCP · live demo</text>
