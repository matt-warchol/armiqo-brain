<text x="954" y="480" font-family="Arial,sans-serif" fill="#e5d9ff" font-size="16" font-weight="bold" text-anchor="middle">NEXT 48 HOURS</text>
<text x="954" y="502" font-family="Arial,sans-serif" fill="#bdabd8" font-size="16" text-anchor="middle">One concrete move</text>
<text x="79" y="600" font-family="monospace" fill="#b7adc9" font-size="18">You ship code. Brain brings the client playbook.</text>
