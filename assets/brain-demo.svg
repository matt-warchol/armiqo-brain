<text x="105" y="185" font-family="Arial,sans-serif" fill="#b8b3cb" font-size="17">YOU · Technical founder</text>
<text x="105" y="225" font-family="Arial,sans-serif" fill="#fff" font-size="22" font-weight="bold">Client went quiet. Renewal in 90 days.</text>
<text x="105" y="252" font-family="Arial,sans-serif" fill="#e0dce9" font-size="19">What should I do without another meeting?</text>
